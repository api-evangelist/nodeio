name: Node.io
description: Node (Node.io, legally Node Inc.) was an artificial-intelligence startup founded in 2014
  by former Google executive Falon Fatemi. Node marketed an "artificial intuition" platform that combined
  a customer's CRM data with a large external graph of people and companies to score and predict which
  prospects, partners, employees, or investors a business should engage next. The company raised roughly
  $16M from investors including 500 Global, Mark Cuban, Avalon Ventures, Canaan Partners, and Bee Partners.
  On 2020-08-24 Node Inc. was acquired by SugarCRM, which folded the technology into its sales and CX
  products rather than continuing to sell it as a standalone product. Node.io no longer operates as an
  independent company and publishes no developer portal, documentation, or public API; the node.io domain
  is now a parked GoDaddy/Afternic "for sale" listing. This profile is retained in the API Evangelist
  network as a historical company record with no live API surface to enrich.
